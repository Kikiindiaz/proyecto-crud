<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
    <!--Navegación-->
    <nav class="navbar navbar-light bg-light">
          <span class="navbar-brand mb-0 h1">App de Alumnos</span>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">
                        <h2>Datos del Alumno</h2>
                    </div>
                    <div class="card-body">
                        <form id="formulario">
                            <div class="form-group">
                                <input type="text" id="Nombre" class="form-control my-3" placeholder="Ingresar Nombre ">
                            </div>
                            <div class="form-group">
                                <textarea id="Matrícula" class="form-control my-3" placeholder="Ingresar Matrícula"></textarea>
                            </div>
                            <div class="form-group">
                                <input type="number" id="grado" class="form-control my-3" placeholder="Ingresar Grado">
                            </div>
                            <button type="submit" class="btn btn-primary">Agregar</button>
                        </form>

                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <table class="table caption-top bg-light">
                    <thead>
                      <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Matrícula</th>
                        <th scope="col">Grado</th>
                      </tr>
                    </thead>
                    <tbody id="tbody">
                      <tr>
                        <td>Alumno</td>
                        <td>Matricula</td>
                        <td>Grado</td>
                      </tr>
                    </tbody>
                  </table>
            </div>
        </div>
    </div>



    <!--Importamos bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    
    <script src="/app.js"></script>
</body>
</html>
